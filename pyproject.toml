[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-honeypot"
version = "1.0.0"
description = "Honeypot IoT — Emula dispositivos IoT vulnerables para capturar tráfico de ataque"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Shadow-King-Cyber"}]
dependencies = ["click>=8.1", "jinja2>=3.1"]
[project.optional-dependencies]
dev = ["pytest>=8.0"]
[project.scripts]
iot-honeypot = "iot_honeypot.ui.cli:main"
[tool.pytest.ini_options]
testpaths = ["tests"]
